<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>外卖比价 AI 助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
    <style>
        @media (prefers-color-scheme: dark) {
            html {
                color-scheme: dark;
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4">
    <div class="max-w-xl mx-auto">
        <h1 class="text-2xl font-bold text-center mb-6 text-blue-600">外卖比价 AI 助手</h1>
        
        <div class="bg-white rounded-lg shadow p-4 mb-4">
            <!-- ✅ 已修复：去掉 capture，支持拍照+相册 -->
            <input type="file" id="file-input" accept="image/*" class="hidden">
            <button id="upload-btn" class="w-full bg-blue-500 text-white py-3 rounded-lg font-bold">
                上传外卖截图
            </button>
        </div>

        <div id="loading" class="hidden text-center py-4">
            <p>AI 识别中...</p>
        </div>

        <div id="result" class="hidden bg-white rounded-lg shadow p-4 mb-4">
            <h2 class="font-bold text-lg mb-2">识别结果</h2>
            <div id="result-content"></div>
            
            <div class="grid grid-cols-3 gap-2 mt-4">
                <a id="meituan-btn" target="_blank" class="bg-yellow-500 text-white text-center py-2 rounded">美团</a>
                <a id="jd-btn" target="_blank" class="bg-red-500 text-white text-center py-2 rounded">京东</a>
                <a id="taobao-btn" target="_blank" class="bg-green-500 text-white text-center py-2 rounded">淘宝</a>
            </div>
        </div>

        <div class="bg-white rounded-lg shadow p-4">
            <h2 class="font-bold text-lg mb-2">历史记录</h2>
            <div id="history-list" class="space-y-2"></div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js');
            });
        }

        const API_URL = "/api/compare";
        const MAX_HISTORY = 10;
        let currentResult = null;

        window.addEventListener('load', async () => {
            loadHistory();
            try {
                const items = await navigator.clipboard.read();
                for (const item of items) {
                    if (item.types.includes('image/png')) {
                        const blob = await item.getType('image/png');
                        processImage(blob);
                        return;
                    }
                }
            } catch (e) {}
        });

        document.getElementById('upload-btn').addEventListener('click', () => {
            document.getElementById('file-input').click();
        });

        document.getElementById('file-input').addEventListener('change', (e) => {
            if (e.target.files[0]) {
                processImage(e.target.files[0]);
            }
        });

        async function processImage(file) {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('result').classList.add('hidden');
            
            const formData = new FormData();
            formData.append('image', file);

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.error) {
                    alert(`识别失败：${data.error}${data.details ? '\n' + data.details : ''}`);
                } else {
                    displayResult(data);
                    saveToHistory(data);
                }
            } catch (e) {
                alert('网络连接失败，请检查网络后重试');
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function displayResult(data) {
            currentResult = data;
            const content = document.getElementById('result-content');
            document.getElementById('result').classList.remove('hidden');

            let html = `
                <p><strong>商家：</strong>${data.shop_name}</p>
                <p><strong>套餐：</strong>${data.package_name}</p>
                <p><strong>配料：</strong>${data.ingredients.join('、')}</p>
                <p><strong>原价：</strong>¥${data.original_price}</p>
            `;

            content.innerHTML = html;

            document.getElementById('meituan-btn').href = `https://waimai.meituan.com/search?query=${encodeURIComponent(data.search_queries.meituan)}`;
            document.getElementById('jd-btn').href = `https://search.jd.com/Search?keyword=${encodeURIComponent(data.search_queries.jd)}&enc=utf-8&wq=${encodeURIComponent(data.search_queries.jd)}`;
            document.getElementById('taobao-btn').href = `https://market.m.taobao.com/app/tb-search/search?keyword=${encodeURIComponent(data.search_queries.taobao)}`;
        }

        function saveToHistory(data) {
            let history = JSON.parse(localStorage.getItem('compare_history') || '[]');
            history.unshift({
                ...data,
                timestamp: Date.now()
            });

            if (history.length > MAX_HISTORY) {
                history = history.slice(0, MAX_HISTORY);
            }

            localStorage.setItem('compare_history', JSON.stringify(history));
            loadHistory();
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('compare_history') || '[]');
            const historyList = document.getElementById('history-list');

            if (history.length === 0) {
                historyList.innerHTML = '<p class="text-gray-500 text-center">暂无历史记录</p>';
                return;
            }

            let html = '';
            history.forEach((item, index) => {
                html += `
                    <div class="border p-2 rounded cursor-pointer history-item" data-index="${index}">
                        <p class="font-bold">${item.shop_name}</p>
                        <p class="text-sm">${item.package_name}</p>
                    </div>
                `;
            });

            historyList.innerHTML = html;

            document.querySelectorAll('.history-item').forEach(item => {
                item.addEventListener('click', () => {
                    const index = parseInt(item.dataset.index);
                    displayResult(history[index]);
                    document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
                });
            });
        }
    </script>
</body>
</html>
